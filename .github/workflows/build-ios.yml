name: Build RYU iOS rootless virtual HID research tool

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  ios-deb:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites and Theos
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid dpkg make
          git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git "$HOME/theos"
          test -f "$HOME/theos/makefiles/common.mk"
          # The macOS GitHub runner already includes Xcode and its iPhoneOS SDK.
          # Theos creates its own sdks/ directory. Do NOT git-clone into it.
          echo 'Using Xcode iPhoneOS SDK:'
          xcrun --sdk iphoneos --show-sdk-path
          echo 'GNU Make:'
          gmake --version | head -n 1

      - name: Build rootless DEB (not runtime validated)
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          gmake -C ios package FINALPACKAGE=1
          ls -lh ios/packages/*.deb

      - name: Build Calculator-only UIKit route probe V12
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          gmake -C ios/calcprobe package FINALPACKAGE=1
          ls -lh ios/calcprobe/packages/*.deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: RYU-V12-Calculator-App-Route
          path: |
            ios/packages/*.deb
            ios/calcprobe/packages/*.deb
          if-no-files-found: error
